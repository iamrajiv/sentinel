name: codex

on:
  push:
    branches: [main]
  pull_request:

# Sentinel's own repository is held to Sentinel's codex. The actions below are
# pinned to full commit SHAs because CDX-002 says so, and a guardrail its own
# repo violates is a guardrail nobody else will take seriously.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The deterministic half of the codex is scored on every commit: hermetic,
      # sub-second, no Cloudflare account, no inference spend. The judged half
      # needs recordings or credentials and is scored on demand instead.
      - name: Codex evals
        run: npm run evals

      - name: Build
        run: npm run build
